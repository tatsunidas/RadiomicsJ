!
! radiomicsj params
!
INT_label=1
! NEAREST_NEIGHBOR=0, NONE=0, BILINEAR=1, BICUBIC=2;
INT_interpolation2D=2
INT_interpolation_mask2D=2
! 100:TRILINEARINTERP
INT_interpolation3D=100
INT_interpolation_mask3D=100
DOUBLE_Mask_PartialVolumeThareshold=0.5
BOOL_USE_FixedBinNumber=1
DOUBLE_binWidth=25
INT_binCount=32
#BOOL_normalize=0
BOOL_removeOutliers=1
DOUBLE_zScore=3
#DOUBLE_normalizeScale=
#DOUBLE_densityShift=
#DOUBLE_rangeMax=400
#DOUBLE_rangeMin=-1000
#DOUBLEARRAY_resamplingFactorXYZ=1.0,1.0,1.0
BOOL_activate_no_default_features=0
BOOL_force2D=0
!
!texture param
!
INT_alpha=0
INT_deltaGLCM=1
INT_deltaNGTDM=1
INT_deltaNGLDM=1
!
! (Not implemented) Notice: STRING_weightingNorm: nothing or, "no_weighting", "manhattan", "euclidian", "infinity"
! 
#STRING_weightingNorm=
!
!IVH param
!
INT_IVH_binCount=1000
DOUBLE_IVH_binWidth=2.5
!IVH mode 0:No discretise (default), 1 binWidth, 2 binCount else back to defalut
INT_IVH_MODE=0
!
!GLAM param (gray level affinity metrics)
!
! GLAM measures a radial distribution function over spherical shells, so it is a
! three dimensional descriptor. It is skipped when force2D is on.
! It also measures distances on the voxel lattice, so resample to isotropic
! voxels (DOUBLEARRAY_resamplingFactorXYZ) before turning it on.
!
! Largest distance, in voxels, at which the radial distribution is evaluated.
INT_GLAM_maxRadius=100
! Normalise each shell by the part of it that still lies inside the roi, so that
! g(r) is not confounded by the shape of the roi. 1 follows the paper, 0
! reproduces the reference implementation, which uses ideal spherical shells.
BOOL_GLAM_boundaryCorrection=1
! Reference voxels per gray level. 0 uses every roi voxel, which is exact but
! costs O(n^2). A positive value takes an evenly spread subset instead: on a
! 113000 voxel roi, 1000 reference voxels ran about 3 times faster and moved the
! second virial coefficient by 0.15 percent.
INT_GLAM_maxReferenceVoxels=0
! Shuffles used to estimate the randomised reference state. 0, the default, uses
! the exact closed form of that state, which is reproducible and free of
! sampling noise. Set it to 4 to follow the original framework instead.
INT_GLAM_numRandomisations=0
LONG_GLAM_randomSeed=42
! Smoothing of g(r) before peaks and gradients are located. The window has to be odd.
INT_GLAM_savitzkyGolayWindow=7
INT_GLAM_savitzkyGolayPolynomial=3
! Prominence a maximum of g(r) needs to count as the first coordination shell,
! and how far to search for that shell when no prominent maximum is found.
DOUBLE_GLAM_peakProminence=4
INT_GLAM_maxLocalShellRadius=30
!
!Fractal param
!
INTARRAY_box_sizes=2,3,4,6,8,12,16,32,64
!
!Select calculating features
!
BOOL_enableOperationalInfo=1
BOOL_enableDiagnostics=1
BOOL_enableMorphological=1
BOOL_enableLocalIntensityFeatures=1
BOOL_enableIntensityBasedStatistics=1
BOOL_enableIntensityHistogram=1
BOOL_enableIntensityVolumeHistogram=1
BOOL_enableShape2D=0
BOOL_enableGLCM=1
BOOL_enableGLRLM=1
BOOL_enableGLSZM=1
BOOL_enableGLDZM=1
! GLAM is off by default: it is not part of IBSI and scans every pair of roi voxels.
BOOL_enableGLAM=0
BOOL_enableNGTDM=1
BOOL_enableNGLDM=1
BOOL_enableFractal=1
#BOOL_enableHomological=0