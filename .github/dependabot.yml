version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # the pom pins old versions on purpose in places (Java 8 target); keep the noise low
    open-pull-requests-limit: 3
    ignore:
      # junit 6 needs Java 17; the tests are also run on a Java 8 runtime
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]
